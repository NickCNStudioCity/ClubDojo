<!doctype html>
<!-- Dev only: runs the Basketball server rules in the browser and mounts the real client, so the
     courts can be checked without a server, login or pavilion.
     Open with: node scripts/dev-web.js, then http://localhost:5173/scripts/dev/basketball-harness.html
     Options: ?ms=<round length>; ?auto=1 makes a script play your court well. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basketball harness</title>
  <link rel="stylesheet" href="../../shared/client/styles.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1b2430; color: #fff; font-family: system-ui, sans-serif; }
    #stage { position: relative; height: 100vh; }
  </style>
  <script src="../../shared/protocol.js"></script>
  <script src="../../shared/client/avatar.js"></script>
</head>
<body>
  <div id="stage"></div>
  <script>
  (async function () {
    const h = (tag, attrs, ...kids) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
      for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
      return el;
    };

    const src = await (await fetch('../../server/src/minigames/games/basketball.js')).text();
    const mod = { exports: {} };
    new Function('module', 'exports', src)(mod, mod.exports);
    const game = mod.exports;

    let clientDef = null;
    window.ClubDojoMinigames = { register: (d) => { clientDef = d; } };
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '../../shared/client/minigames/games/basketball.js';
      s.onload = resolve; s.onerror = reject; document.head.append(s);
    });

    const q = new URLSearchParams(location.search);
    const players = [{ id: 1, name: 'You', loadout: { v: 1, id: 1, name: 'You', color: '#2f6fd1', headband: '#f5b82e', belt: 'yellow', accessories: {} } }];
    let client = null;
    let lastState = null;
    const start = performance.now();
    const settings = { ...game.defaults };
    if (q.get('ms')) settings.roundMs = Number(q.get('ms'));
    const seen = {};
    const sctx = {
      game: game.id, settings, players,
      isPlaying: () => true,
      send: () => {},
      broadcast: (data) => {
        seen[data.type] = (seen[data.type] || 0) + 1;
        if (data.type === 'state') lastState = data;
        if (data.type === 'shot' && data.id === 1) (window.__myShots = window.__myShots || []).push(data);
        if (client) client.onMessage(JSON.parse(JSON.stringify(data)));
      },
      after: (ms, fn) => setTimeout(fn, ms),
      every: (ms, fn) => setInterval(fn, ms),
      cancel: (t) => { clearTimeout(t); clearInterval(t); },
      now: () => performance.now() - start,
      randomInt: (n) => Math.floor(Math.random() * n),
      end: (results) => { window.__results = results; console.log('round ended', results); clearInterval(loop); if (client) client.onResults(results); },
      log: console.log,
    };
    const server = game.create(sctx);
    client = clientDef.mount({
      el: document.getElementById('stage'), youId: 1, players, h, avatar: window.ClubDojoAvatar,
      toast: (m) => console.log('toast', m), protocol: window.ClubDojoProtocol,
      send: (data) => server.input(1, data),
    });
    server.start();
    window.__bb = { server, client, seen, get state() { return lastState; } };

    let last = performance.now();
    const loop = setInterval(() => {
      const now = performance.now();
      server.tick((now - last) / 1000);
      last = now;
    }, 1000 / game.tickRate);
  })().catch((e) => { document.body.textContent = e.stack; });
  </script>
</body>
</html>
