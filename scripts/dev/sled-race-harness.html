<!doctype html>
<!-- Dev only: runs the Sled Race server rules in the browser and mounts the real client, so the
     run can be played without a server, login or pavilion. Bots fill the other slots.
     Open with: node scripts/dev-web.js, then http://localhost:5173/scripts/dev/sled-race-harness.html
     Options: ?bots=0..3 (default 3), ?course=0..2 (Pine Run, Frost Gully, Summit Dash; default random) -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sled Race harness</title>
  <link rel="stylesheet" href="../../shared/client/styles.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1b2430; color: #fff; font-family: system-ui, sans-serif; }
    #stage { position: relative; height: 100vh; }
  </style>
  <script src="../../shared/protocol.js"></script>
  <script src="../../shared/client/avatar.js"></script>
</head>
<body>
  <div id="stage"></div>
  <script>
  (async function () {
    const h = (tag, attrs, ...kids) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
      for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
      return el;
    };

    const src = await (await fetch('../../server/src/minigames/games/sled-race.js')).text();
    const mod = { exports: {} };
    new Function('module', 'exports', 'require', src)(mod, mod.exports, () => ({}));
    const game = mod.exports;

    let clientDef = null;
    window.ClubDojoMinigames = { register: (d) => { clientDef = d; } };
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '../../shared/client/minigames/games/sled-race.js';
      s.onload = resolve; s.onerror = reject; document.head.append(s);
    });

    const bots = Math.max(0, Math.min(3, Number(new URLSearchParams(location.search).get('bots') ?? 3)));
    const colors = ['#2f6fd1', '#5a3e8c', '#1f6f5c', '#8c3e3e'];
    const players = Array.from({ length: bots + 1 }, (_, i) => ({
      id: i + 1, name: i ? `Bot ${i}` : 'You',
      loadout: { v: 1, id: i + 1, name: i ? `Bot ${i}` : 'You', color: colors[i], headband: ['#e8453c', '#f5b82e', '#3fbf7f', '#ffffff'][i], belt: ['yellow', 'white', 'green', 'black'][i] || 'white', accessories: {} },
    }));

    let client = null, track = null, lastState = null;
    const cq = new URLSearchParams(location.search).get('course');
    let forceCourse = cq === null ? null : Number(cq); // the first random pick is the course
    const start = performance.now();
    const sctx = {
      game: game.id, settings: { ...game.defaults }, players,
      isPlaying: () => true,
      send: (id, data) => { if (id === 1 && client) client.onMessage(data); },
      broadcast: (data) => { if (data.type === 'track') track = data; if (data.type === 'state') lastState = data; if (client) client.onMessage(data); },
      after: (ms, fn) => setTimeout(fn, ms),
      every: (ms, fn) => setInterval(fn, ms),
      cancel: (t) => { clearTimeout(t); clearInterval(t); },
      now: () => performance.now() - start,
      randomInt: (n) => { if (forceCourse !== null) { const c = forceCourse; forceCourse = null; return c % n; } return Math.floor(Math.random() * n); },
      end: (results) => { console.log('race ended', results); window.__results = results; clearInterval(loop); },
      log: console.log,
    };
    const server = game.create(sctx);
    client = clientDef.mount({
      el: document.getElementById('stage'), youId: 1, players, h, avatar: window.ClubDojoAvatar,
      toast: (m) => console.log('toast', m), protocol: window.ClubDojoProtocol,
      send: (data) => server.input(1, data),
    });
    server.start();
    window.__sled = { server, client, players, get state() { return lastState; }, get track() { return track; } };

    // Bots: look a little ahead, steer away from rocks and toward coins and ramps, trick in the air.
    const botDir = new Map();
    function botControls() {
      if (!lastState || !track) return;
      for (const [sid, v] of Object.entries(lastState.players)) {
        const id = Number(sid);
        if (id === 1) continue;
        const [x, y, , , , air] = v;
        let best = x, bestScore = -Infinity;
        for (const cand of [-0.75, -0.25, 0.25, 0.75, x]) {
          let score = -Math.abs(cand - x) * 0.6;
          for (const ob of track.obstacles) {
            const d = ob.y - y;
            if (d < 0 || d > 150 || Math.abs(ob.x - cand) > 0.24) continue;
            score += ob.kind === 'rock' ? -10 : ob.kind === 'ramp' ? 2 : ob.kind === 'boost' ? 2 : 1;
          }
          score += Math.random() * 0.3 * id;
          if (score > bestScore) { bestScore = score; best = cand; }
        }
        const dir = Math.abs(best - x) < 0.06 ? 0 : best > x ? 1 : -1;
        if (botDir.get(id) !== dir) { botDir.set(id, dir); server.input(id, { type: 'steer', dir }); }
        server.input(id, { type: 'tuck', on: dir === 0 && id !== 3 });
        if (air) server.input(id, { type: 'trick' });
      }
    }

    let last = performance.now();
    const loop = setInterval(() => {
      const now = performance.now();
      server.tick((now - last) / 1000);
      last = now;
      botControls();
    }, 1000 / game.tickRate);
  })().catch((e) => { document.body.textContent = e.stack; });
  </script>
</body>
</html>
