<!doctype html>
<!-- Dev only: runs the Tennis server rules in the browser and mounts the real client, so the court
     can be checked without a server, login or pavilion.
     Open with: node scripts/dev-web.js, then http://localhost:5173/scripts/dev/tennis-harness.html
     Options: ?duel=1 adds a second ninja played by a script; ?auto=1 lets a script play for you too;
     ?ms=<round length>. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis harness</title>
  <link rel="stylesheet" href="../../shared/client/styles.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1b2430; color: #fff; font-family: system-ui, sans-serif; }
    #stage { height: 100vh; }
  </style>
  <script src="../../shared/protocol.js"></script>
  <script src="../../shared/client/avatar.js"></script>
  <script src="../../shared/client/minigames/host.js"></script>
</head>
<body>
  <div id="stage"></div>
  <script>
  (async function () {
    const h = (tag, attrs, ...kids) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
      for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
      return el;
    };

    const src = await (await fetch('../../server/src/minigames/games/tennis.js')).text();
    const mod = { exports: {} };
    new Function('module', 'exports', src)(mod, mod.exports);
    const game = mod.exports;

    let clientDef = null;
    window.ClubDojoMinigames = { register: (d) => { clientDef = d; } };
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '../../shared/client/minigames/games/tennis.js';
      s.onload = resolve; s.onerror = reject; document.head.append(s);
    });

    const q = new URLSearchParams(location.search);
    const duel = q.get('duel') === '1';
    const auto = q.get('auto') === '1';
    const players = [
      { id: 1, name: 'You', loadout: { v: 1, id: 1, name: 'You', color: '#2f6fd1', headband: '#f5b82e', belt: 'yellow', accessories: {} } },
    ];
    if (duel) players.push({ id: 2, name: 'Kai', loadout: { v: 1, id: 2, name: 'Kai', color: '#1f6f5c', headband: '#e8453c', belt: 'green', accessories: {} } });

    let client = null;
    let lastState = null;
    let hits = 0;
    const start = performance.now();
    const settings = { ...game.defaults };
    if (q.get('ms')) settings.roundMs = Number(q.get('ms'));
    const sctx = {
      game: game.id, settings, players,
      isPlaying: () => true,
      send: (id, data) => { if (id === 1 && client) client.onMessage(JSON.parse(JSON.stringify(data))); },
      broadcast: (data) => {
        if (data.type === 'state') lastState = data;
        if (data.type === 'hit') hits++;
        if (client) client.onMessage(JSON.parse(JSON.stringify(data)));
      },
      after: (ms, fn) => setTimeout(fn, ms),
      every: (ms, fn) => setInterval(fn, ms),
      cancel: (t) => { clearTimeout(t); clearInterval(t); },
      now: () => performance.now() - start,
      randomInt: (n) => Math.floor(Math.random() * n),
      end: (results) => { window.__results = results; console.log('round ended', results); clearInterval(loop); if (client) client.onResults(results); },
      log: console.log,
    };
    const server = game.create(sctx);
    client = clientDef.mount({
      el: document.getElementById('stage'), fit: (...a) => window.ClubDojoFit(document.getElementById('stage'), ...a), youId: 1, players, h, avatar: window.ClubDojoAvatar,
      toast: (m) => console.log('toast', m), protocol: window.ClubDojoProtocol,
      send: (data) => { if (!auto) server.input(1, data); },
    });
    server.start();
    window.__tennis = { server, client, players, get state() { return lastState; } };

    // Scripted players: walk to the landing spot, wind up, release around the bounce, aim away.
    const plans = new Map();
    function scripted(id) {
      const st = lastState;
      if (!st) return;
      const me = st.players.find((p) => p.id === id);
      const foe = st.players.find((p) => p.id !== id);
      const f = st.flight;
      const now = performance.now();
      if (f && f.from !== id) {
        let plan = plans.get(id);
        if (!plan || plan.key !== hits) {
          const shift = (foe.x < 10 ? 1 : -1) * (1.5 + Math.random() * 2);
          const delta = Math.max(-260, Math.min(160, shift > 0 ? shift / 4.5 * 250 : shift / 4.5 * 350));
          plan = { key: hits, seen: now, hold: Math.random() < 0.3 ? 80 : 600 + Math.random() * 600, relAt: now + f.eta + delta + (Math.random() * 2 - 1) * 70 };
          plans.set(id, plan);
        }
        if (now - plan.seen > 220) {
          const dx = f.tx - me.x, dy = f.ty - me.y;
          server.input(id, { type: 'move', dx: Math.abs(dx) > 0.4 ? Math.sign(dx) : 0, dy: Math.abs(dy) > 0.4 ? Math.sign(dy) : 0 });
        }
        if (!plan.pressed && now >= plan.relAt - plan.hold) { plan.pressed = true; server.input(id, { type: 'press' }); }
        if (plan.pressed && !plan.done && now >= plan.relAt) { plan.done = true; server.input(id, { type: 'release' }); }
      } else {
        server.input(id, { type: 'move', dx: 0, dy: 0 });
        if (st.serve === id && Math.random() < 0.03) { server.input(id, { type: 'press' }); setTimeout(() => server.input(id, { type: 'release' }), 500); }
      }
    }

    let last = performance.now();
    const loop = setInterval(() => {
      const now = performance.now();
      server.tick((now - last) / 1000);
      last = now;
      if (duel) scripted(2);
      if (auto) scripted(1);
    }, 1000 / game.tickRate);
  })().catch((e) => { document.body.textContent = e.stack; });
  </script>
</body>
</html>
